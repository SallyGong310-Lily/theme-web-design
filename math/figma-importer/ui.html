<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:13px Arial,sans-serif;background:#f4f2eb;color:#242820;padding:18px}h2{font-size:21px}p{line-height:1.8}button{background:#242820;color:#f4f2eb;border:0;padding:12px 20px;margin:20px 0;cursor:pointer}input{width:100%}#status{color:#234ed7}</style><h2>AXIOM · 可编辑导入</h2><p>选择本套设计的 design-desktop.svg 或 design-mobile.svg。矢量保留为矢量，文字建立为真正的 Figma 文本层。</p><input type="file" accept=".svg,image/svg+xml" id="file"><button id="import">导入画板</button><p id="status" role="status"></p><script>
document.querySelector('#import').onclick=async()=>{const file=document.querySelector('#file').files[0];if(!file){document.querySelector('#status').textContent='请先选择 SVG。';return}try{const doc=new DOMParser().parseFromString(await file.text(),'image/svg+xml');if(doc.querySelector('parsererror'))throw Error('SVG 解析失败');const root=doc.documentElement;const texts=[...root.querySelectorAll('text')].map(el=>({text:el.textContent,x:+el.getAttribute('x'),y:+el.getAttribute('y'),size:+el.getAttribute('font-size'),family:el.getAttribute('font-family'),weight:+el.getAttribute('font-weight'),fill:el.getAttribute('fill')}));root.querySelectorAll('text').forEach(el=>el.remove());document.querySelector('#status').textContent='正在建立矢量与文字层…';document.querySelector('#import').disabled=true;parent.postMessage({pluginMessage:{type:'import',name:file.name,svg:new XMLSerializer().serializeToString(root),texts}},'*')}catch(e){document.querySelector('#status').textContent=e.message}};
onmessage=e=>{if(e.data.pluginMessage){document.querySelector('#status').textContent=e.data.pluginMessage.message;document.querySelector('#import').disabled=false}};
</script></html>
