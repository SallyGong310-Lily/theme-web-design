<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:14px/1.8 Arial,sans-serif;background:#f3f0e8;color:#292c27;padding:20px}h2{font-size:22px;font-weight:400;margin:0 0 10px}input{max-width:100%;padding:15px 0}button{background:#a83c2d;color:white;border:0;padding:11px 22px;cursor:pointer}button:disabled{opacity:.5}#status{font-size:12px;white-space:pre-wrap}</style><h2>余色 / 可编辑导入</h2><p>选择交付包里的桌面或手机 SVG。<br>创建原生文字、矢量形状与图像图层。</p><input id="file" type="file" accept=".svg,image/svg+xml" aria-label="选择余色SVG"><br><button id="import" disabled>导入到当前页面</button><p id="status" role="status">所有操作都在本地完成，不发送网络请求。</p><script>
let scene=null;
document.getElementById('file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const source=await file.text(),doc=new DOMParser().parseFromString(source,'image/svg+xml');if(doc.querySelector('parsererror'))throw Error('SVG 格式不正确');const data=doc.querySelector('#afterimage-scene');if(!data)throw Error('请选择本次交付的余色 SVG 文件');scene=JSON.parse(data.textContent);for(const item of scene.items){if(item.type==='image'){const image=doc.getElementById(item.imageNode);if(!image)throw Error('图片元数据不完整');item.src=image.getAttribute('href')||image.getAttribute('xlink:href')}}document.getElementById('import').disabled=false;document.getElementById('status').textContent=`已读取 ${scene.width} × ${scene.height}，共 ${scene.items.filter(i=>i.type==='text').length} 个文字层。`}catch(err){scene=null;document.getElementById('import').disabled=true;document.getElementById('status').textContent=err.message}};
document.getElementById('import').onclick=()=>{document.getElementById('import').disabled=true;document.getElementById('status').textContent='正在创建可编辑图层…';parent.postMessage({pluginMessage:{type:'import',scene}},'*')};
onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;document.getElementById('status').textContent=m.message;if(m.type==='error')document.getElementById('import').disabled=false};
</script></html>
