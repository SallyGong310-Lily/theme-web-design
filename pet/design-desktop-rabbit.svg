ke="none"/><text x="88" y="670" fill="#F8F5ED" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >开启陪伴提案</text><text x="221" y="671" fill="#F8F5ED" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" >↗</text><text x="284" y="670" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >探索日常灵感</text><path d="M284 677H356" stroke="#392C40"/><text x="64" y="745" fill="#716978" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" >♡  FOR THE ONES WHO MAKE A HOUSE A HOME.</text></g><g id="Hero / Scene"><path d="M756 714V450C756 107 1376 107 1376 450V714Q1376 736 1354 736H778Q756 736 756 714Z" fill="#DBE1BC"/><ellipse cx="1066" cy="431" rx="228" ry="223" fill="none" stroke="#AD8977" stroke-opacity=".45"/><g id="Original editable rabbit illustration" transform="translate(774 114) scale(.96)"><ellipse cx="308" cy="563" rx="238" ry="43" fill="#B49D88" opacity=".2"/>
