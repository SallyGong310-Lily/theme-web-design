        </g></g><rect x="40" y="630" width="145" height="30" rx="15" fill="#F8F5ED" stroke="none"/><text x="51" y="649" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="9" >THE GOOD LIFE CLUB</text><circle cx="332" cy="607" r="40" fill="#D7EB77"/><text x="303" y="600" fill="#392C40" font-family="Georgia, serif" font-size="14" font-style="italic">Made for</text><text x="297" y="617" fill="#392C40" font-family="Georgia, serif" font-size="14" font-style="italic">each other.</text><text x="42" y="963" fill="#392C40" font-family="Georgia, serif" font-size="22" >Meet Milo.</text><text x="42" y="983" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="9" >散步搭子 · 把普通日子变成探险</text><circle cx="293" cy="970" r="18" fill="none" stroke="#392C40"/><circle cx="337" cy="970" r="18" fill="none" stroke="#392C40"/><text x="284" y="976" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" >←</text><text x="328" y="976" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" >→</text><rect x="24" y="1025" width="92" height="3" rx="0" fill="#392C40" stroke="none"/><rect x="123" y="1025" width="92" height="3" rx="0" fill="#DBD5CA" stroke="none"/><rect x="222" y="1025" width="92" height="3" rx="0" fill="#DBD5CA" stroke="none"/><text x="324" y="1030" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="9" >01 / 03</text><path d="M24 1070H366" stroke="#D9D4CC"/><text x="24" y="1110" fill="#392C40" font-family="Georgia, serif" font-size="18" font-style="italic">Little rituals.</text><text x="172" y="1110" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" >✳</text><text x="215" y="1110" fill="#392C40" font-family="Georgia, serif" font-size="18" font-style="italic">Real connection.</text><path d="M24 1137H366" stroke="#D9D4CC"/><text x="24" y="1191" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="9" letter-spacing="1.2">01 — THE ART OF BEING TOGETHER</text><text x="24" y="1242" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" >爱，藏在日常的细节里。</text><text x="24" y="1282" fill="#716978" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >不必每一天都精彩。</text><text x="24" y="1307" fill="#716978" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >有你在的小事，就是它的大世界。</text><rect x="24" y="1340" width="342" height="196" rx="12" fill="#D7EB77" stroke="#D9D4CC"/><text x="47" y="1372" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" >01 / RITUAL</text><g transform="translate(287 1360) scale(.8)" fill="none" stroke="#392C40" stroke-width="1.5"><path d="M11 38C3 27 9 17 19 20C20 5 35 5 37 19C51 12 57 28 44 39L28 51Z"/><path d="M20 33l7 7 14-15"/></g><text x="47" y="1438" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" >日常，有小小仪式</text><text x="47" y="1474" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >从出门前的一次回望，</text><text x="47" y="1497" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >到睡前安静的十分钟。</text><text x="321" y="1508" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" >↗</text><rect x="24" y="1548" width="342" height="196" rx="12" fill="#F8F5ED" stroke="#D9D4CC"/><text x="47" y="1580" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" >02 / UNDERSTAND</text><g transform="translate(287 1568) scale(.8)" fill="none" stroke="#392C40" stroke-width="1.5"><path d="M8 29Q30 0 52 29Q30 58 8 29Z"/><circle cx="30" cy="29" r="8"/><path d="M30 2V9m0 42v7M2 29h6m44 0h6"/></g><text x="47" y="1646" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" >听懂，无声的表达</text><text x="47" y="1682" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >留意耳朵、尾巴和小动作，</text><text x="47" y="1705" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >把理解放在每一次回应里。</text><text x="321" y="1716" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" >↗</text><rect x="24" y="1756" width="342" height="196" rx="12" fill="#F8F5ED" stroke="#D9D4CC"/><text x="47" y="1788" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" >03 / BELONG</text><g transform="translate(287 1776) scale(.8)" fill="none" stroke="#392C40" stroke-width="1.5"><path d="M10 47V25L30 9l20 16v22H10Z"/><path d="M24 47V32h12v15M18 20V9h7"/><path d="M27 23h6"/></g><text x="47" y="1854" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" >留白，也是陪伴</text><text x="47" y="1890" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >为它留一个自在的角落，</text><text x="47" y="1913" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >也给彼此一点慢下来的时间。</text><text x="321" y="1924" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" >↗</text><rect x="24" y="2000" width="342" height="332" rx="12" fill="#392C40" stroke="none"/><text x="50" y="2037" fill="#F8F5ED" font-family="Arial, Microsoft YaHei, sans-serif" font-size="9" >02 — YOUR KIND OF TOGETHER</text><text x="50" y="2089" fill="#F8F5ED" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32" >没有标准答案，</text><text x="50" y="2132" fill="#D7EB77" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" >只有你们的刚刚好。</text><rect x="50" y="2160" width="238" height="54" rx="27" fill="#D7EB77" stroke="none"/><text x="74" y="2193" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >定制我的陪伴节奏</text><text x="251" y="2194" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" >↗</text><text x="50" y="2263" fill="#D7EB77" font-family="Georgia, serif" font-size="28" font-style="italic">Less rush. More us.</text><text x="50" y="2300" fill="#D0C7D4" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >收下一份属于你们的小小灵感。</text><path d="M24 2370H366" stroke="#D9D4CC"/><text x="24" y="2410" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="bold">MELLOW</text><text x="24" y="2439" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="9" >© 2026 MELLOW · CONCEPT DESIGN</text></svg>