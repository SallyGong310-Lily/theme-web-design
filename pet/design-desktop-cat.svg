        <path d="M252 335q66 29 122 0l-7 23q-54 23-107 0Z" fill="#D7EB77"/><circle cx="311" cy="365" r="13" fill="#392C40"/></g><rect x="776" y="218" width="188" height="38" rx="19" fill="#F8F5ED" stroke="none"/><text x="795" y="242" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="1">THE GOOD LIFE CLUB</text><circle cx="1337" cy="188" r="55" fill="#D7EB77"/><text x="1300" y="179" fill="#392C40" font-family="Georgia, serif" font-size="18" font-style="italic">Made for</text><text x="1290" y="199" fill="#392C40" font-family="Georgia, serif" font-size="18" font-style="italic">each other.</text><text x="1310" y="218" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="9" >EST. 2026</text><text x="784" y="683" fill="#392C40" font-family="Georgia, serif" font-size="26" >Meet Miso.</text><text x="784" y="707" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" >安静室友 · 陪你享受午后的留白</text><circle cx="1287" cy="690" r="21" fill="none" stroke="#392C40"/><circle cx="1338" cy="690" r="21" fill="none" stroke="#392C40"/><text x="1278" y="697" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" >←</text><text x="1329" y="697" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" >→</text><rect x="756" y="771" width="175" height="3" rx="0" fill="#DBD5CA" stroke="none"/><rect x="941" y="771" width="175" height="3" rx="0" fill="#392C40" stroke="none"/><rect x="1126" y="771" width="175" height="3" rx="0" fill="#DBD5CA" stroke="none"/><text x="1323" y="777" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" >02 / 03</text></g><path d="M64 850H1376" stroke="#D9D4CC"/><text x="64" y="900" fill="#392C40" font-family="Georgia, serif" font-size="24" font-style="italic">Little rituals.</text><text x="437" y="900" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" >✳</text><text x="614" y="900" fill="#392C40" font-family="Georgia, serif" font-size="24" font-style="italic">Real connection.</text><text x="997" y="900" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" >✳</text><text x="1094" y="900" fill="#392C40" font-family="Georgia, serif" font-size="24" font-style="italic">A softer kind of living.</text><path d="M64 931H1376" stroke="#D9D4CC"/><g id="Rituals"><text x="64" y="1025" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" letter-spacing="2">01 — THE ART OF BEING TOGETHER</text><text x="64" y="1088" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="45" >爱，藏在日常的细节里。</text><text x="1090" y="1054" fill="#716978" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >不必每一天都精彩。</text><text x="1090" y="1080" fill="#716978" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >有你在的小事，就是它的大世界。</text><g id="Ritual 1"><rect x="64" y="1137" width="424" height="247" rx="12" fill="#D7EB77" stroke="#D9D4CC"/><text x="92" y="1177" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="2">01 / RITUAL</text><g transform="translate(405 1161)" fill="none" stroke="#392C40" stroke-width="1.5"><path d="M11 38C3 27 9 17 19 20C20 5 35 5 37 19C51 12 57 28 44 39L28 51Z"/><path d="M20 33l7 7 14-15"/></g><text x="92" y="1261" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" >日常，有小小仪式</text><text x="92" y="1300" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >从出门前的一次回望，</text><text x="92" y="1325" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >到睡前安静的十分钟。</text><text x="436" y="1349" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" >↗</text></g><g id="Ritual 2"><rect x="508" y="1137" width="424" height="247" rx="12" fill="#F8F5ED" stroke="#D9D4CC"/><text x="536" y="1177" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="2">02 / UNDERSTAND</text><g transform="translate(849 1161)" fill="none" stroke="#392C40" stroke-width="1.5"><path d="M8 29Q30 0 52 29Q30 58 8 29Z"/><circle cx="30" cy="29" r="8"/><path d="M30 2V9m0 42v7M2 29h6m44 0h6"/></g><text x="536" y="1261" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" >听懂，无声的表达</text><text x="536" y="1300" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >留意耳朵、尾巴和小动作，</text><text x="536" y="1325" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >把理解放在每一次回应里。</text><text x="880" y="1349" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" >↗</text></g><g id="Ritual 3"><rect x="952" y="1137" width="424" height="247" rx="12" fill="#F8F5ED" stroke="#D9D4CC"/><text x="980" y="1177" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="2">03 / BELONG</text><g transform="translate(1293 1161)" fill="none" stroke="#392C40" stroke-width="1.5"><path d="M10 47V25L30 9l20 16v22H10Z"/><path d="M24 47V32h12v15M18 20V9h7"/><path d="M27 23h6"/></g><text x="980" y="1261" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" >留白，也是陪伴</text><text x="980" y="1300" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >为它留一个自在的角落，</text><text x="980" y="1325" fill="#625A67" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >也给彼此一点慢下来的时间。</text><text x="1324" y="1349" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" >↗</text></g></g><g id="Conversion"><rect x="64" y="1466" width="1312" height="325" rx="16" fill="#392C40" stroke="none"/><text x="124" y="1530" fill="#F8F5ED" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" letter-spacing="2">02 — YOUR KIND OF TOGETHER</text><text x="124" y="1597" fill="#F8F5ED" font-family="Arial, Microsoft YaHei, sans-serif" font-size="49" >没有标准答案，</text><text x="124" y="1657" fill="#D7EB77" font-family="Arial, Microsoft YaHei, sans-serif" font-size="49" >只有你们的刚刚好。</text><rect x="124" y="1694" width="239" height="54" rx="27" fill="#D7EB77" stroke="none"/><text x="148" y="1727" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >定制我的陪伴节奏</text><text x="326" y="1728" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" >↗</text><path d="M862 1520L862 1740" stroke="#726576"/><text x="912" y="1585" fill="#D7EB77" font-family="Georgia, serif" font-size="57" font-style="italic">Less rush.</text><text x="912" y="1646" fill="#D7EB77" font-family="Georgia, serif" font-size="57" font-style="italic">More us.</text><text x="915" y="1697" fill="#D0C7D4" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >我们相信，好的陪伴从了解开始。</text><text x="915" y="1724" fill="#D0C7D4" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >收下一份属于你们的小小灵感。</text></g><g id="Footer"><path d="M64 1850H1376" stroke="#D9D4CC"/><text x="64" y="1900" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="bold">MELLOW</text><text x="184" y="1898" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" >给每一种陪伴，留一点温柔。</text><text x="868" y="1898" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" >© 2026 MELLOW · CONCEPT DESIGN</text><text x="1300" y="1898" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" >回到顶部 ↑</text></g></svg>