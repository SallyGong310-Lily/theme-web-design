<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1940" viewBox="0 0 1440 1940"><rect x="0" y="0" width="1440" height="1940" rx="0" fill="#F8F5ED" stroke="none"/><g id="Navigation"><text x="64" y="70" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31" font-weight="bold" letter-spacing="-1.5">◒ MELLOW</text><text x="260" y="68" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >尾伴</text><text x="596" y="66" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >遇见伙伴</text><text x="706" y="66" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >陪伴灵感</text><text x="816" y="66" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >关于尾伴</text><rect x="1200" y="37" width="176" height="44" rx="22" fill="#F8F5ED" stroke="#392C40"/><text x="1221" y="64" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >找到你的节奏    ↗</text><path d="M64 112H1376" stroke="#D9D4CC"/></g><g id="Hero / Copy"><text x="64" y="201" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="2">●  A LITTLE WILD. A LOT OF LOVE.</text><text x="64" y="318" fill="#392C40" font-family="Georgia, serif" font-size="97" letter-spacing="-5">Life is better</text><text x="64" y="414" fill="#392C40" font-family="Georgia, serif" font-size="97" letter-spacing="-5">with a little</text><rect x="65" y="492" width="207" height="20" rx="10" fill="#D7EB77" stroke="none"/><text x="64" y="510" fill="#392C40" font-family="Georgia, serif" font-size="97" font-style="italic" letter-spacing="-5">wild.</text><text x="64" y="570" fill="#6F6675" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" >把日子过慢一点，把爱放大一点。</text><text x="64" y="600" fill="#6F6675" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" >和毛茸茸的家人，一起找到生活的节奏。</text><rect x="64" y="637" width="194" height="54" rx="27" fill="#392C40" stroke="none"/><text x="88" y="670" fill="#F8F5ED" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" >开启陪伴提案</text><text x="221" y="671" fill="#F8F5ED" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" >↗</text><text x="284" y="670" fill="#392C40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" >探索日常灵感</text><path d="M284 677H356" stroke="#392C40"/><text x="64" y="745" fill="#716978" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" >♡  FOR THE ONES WHO MAKE A HOUSE A HOME.</text></g><g id="Hero / Scene"><path d="M756 714V450C756 107 1376 107 1376 450V714Q1376 736 1354 736H778Q756 736 756 714Z" fill="#DCD8E8"/><ellipse cx="1066" cy="431" rx="228" ry="223" fill="none" stroke="#AD8977" stroke-opacity=".45"/><g id="Original editable cat illustration" transform="translate(774 114) scale(.96)"><ellipse cx="308" cy="563" rx="238" ry="43" fill="#B49D88" opacity=".2"/>
